<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorisse</title>
<style>
  :root { --bg: #14161a; --ink: #e8e6e1; --soft: #9a978f; }
  @media (prefers-color-scheme: light) { :root { --bg: #faf8f4; --ink: #1d1c1a; --soft: #6b6862; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 18px/1.5 Georgia, "Times New Roman", serif;
         display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  main { max-width: 34em; }
  h1 { font-size: 2.4em; font-weight: normal; margin: 0 0 .3em; }
  p { margin: 0 0 .8em; }
  .soft { color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>Lorisse</h1>
  <p>A memory that is yours, in files you can read.</p>
  <p class="soft">The first page is on its way.</p>
</main>
</body>
</html>
